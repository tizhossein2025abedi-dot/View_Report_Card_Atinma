<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مشاهده نتایج دوره</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc,#ecfeff);color:#172033;min-height:100vh}.c{width:min(1000px,calc(100% - 28px));margin:auto}header{padding:24px 0}.nav,.card{background:#fff;border:1px solid #e7eaf0;box-shadow:0 15px 45px #1e293b14;border-radius:24px}.nav{padding:14px 18px;display:flex;align-items:center;gap:14px}.logo{width:58px;height:58px;object-fit:cover;border-radius:16px}h1{font-size:23px;margin:0}.sub{font-size:12px;color:#6b7280;margin-top:4px}.login{max-width:500px;margin:45px auto;padding:32px}.login h2{text-align:center;margin:0 0 10px}.login p{text-align:center;color:#6b7280;font-size:13px;margin-bottom:24px}input{width:100%;height:54px;border:1px solid #dfe3eb;border-radius:14px;text-align:center;font-size:18px;outline:0;letter-spacing:3px}button{width:100%;height:52px;margin-top:12px;border:0;border-radius:14px;background:#4f46e5;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}.error{display:none;background:#fff1f2;color:#be123c;padding:11px;border-radius:12px;text-align:center;font-size:13px;margin-top:12px}.error.show{display:block}.panel{display:none;margin:28px 0}.panel.show{display:block}.welcome{text-align:center;padding:28px;margin-bottom:20px}.profile{width:92px;height:92px;object-fit:cover;border-radius:50%;border:4px solid #eef2ff;box-shadow:0 8px 22px #1e293b18;margin-bottom:12px}.actions{display:flex;gap:10px;margin-top:16px}.actions button{margin:0;flex:1}.print{background:#0f766e}.print:hover{background:#115e59}.logout{background:#64748b}.logout:hover{background:#475569}.welcome h2{margin:0;font-size:24px}.welcome p{color:#6b7280;font-size:13px}.result{padding:24px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.title h3{margin:0}.badge{background:#eef2ff;color:#4f46e5;padding:7px 11px;border-radius:99px;font-size:12px;font-weight:bold}.result>.print{width:auto;height:44px;padding:0 20px;margin:0 0 16px}.report{width:100%;display:block;max-height:78vh;object-fit:contain;border-radius:16px;border:1px solid #e5e7eb;background:#f8fafc}footer{text-align:center;color:#9ca3af;font-size:12px;padding:20px}
</style></head><body><div class="c"><header><div class="nav"><img class="logo" src="https://cdn.imgurl.ir/uploads/j792057____.jpeg"><div><h1>مشاهده نتایج دوره</h1><div class="sub">سامانه مشاهده کارنامه دانش‌آموزان</div></div></div></header><section id="login" class="card login"><h2>ورود به پنل</h2><p>لطفاً رمز عبور خود را وارد کنید</p><input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="رمز عبور"><button onclick="go()">ورود به پنل</button><div id="err" class="error">رمز عبور اشتباه است.</div></section><section id="panel" class="panel"><div class="card welcome"><img id="profile" class="profile" alt="تصویر پروفایل"><h2 id="welcome"></h2><p>کارنامه شما در ادامه نمایش داده می‌شود.</p><div class="actions"><button class="logout" onclick="logout()">خروج از پنل</button></div></div><div class="card result"><div class="title"><h3>کارنامه</h3><span class="badge">نتایج دوره</span></div><button class="print" onclick="printReport()">🖨️ چاپ کارنامه</button><img id="report" class="report"></div></section><footer>© آتی نما</footer></div><script>
const s={
"528514418":{n:"محمد نقوی",p:"https://cdn.imgurl.ir/uploads/g079422_-2147483648_-210402_1.jpg",r:"https://cdn.imgurl.ir/uploads/d461253_.jpg"},
"12345":{n:"مهسا علیپور",p:"https://cdn.imgurl.ir/uploads/r708946_.jpg",r:"https://cdn.imgurl.ir/uploads/d461253_.jpg"}
};
function go(){let x=document.getElementById("pw").value.trim(),e=document.getElementById("err");if(!s[x]){e.classList.add("show");return}e.classList.remove("show");document.getElementById("welcome").textContent=s[x].n+" عزیز سلام 🌷";document.getElementById("profile").src=s[x].p;document.getElementById("report").src=s[x].r;document.getElementById("login").style.display="none";document.getElementById("panel").classList.add("show")}
function printReport(){window.print()}
function logout(){document.getElementById("panel").classList.remove("show");document.getElementById("panel").style.display="none";document.getElementById("login").style.display="block";document.getElementById("pw").value="";document.getElementById("err").classList.remove("show");window.scrollTo({top:0,behavior:"smooth"})}
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
</script></body></html>
